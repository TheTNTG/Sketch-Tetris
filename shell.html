<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sketch Tetris</title>
    <style>
      body {
        margin: 0;
        background-color: #0b0b0b;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        touch-action: none; /* Prevents mobile scrolling/zooming */
      }
      canvas.emscripten {
        border: 0px none;
        background-color: #000;
        outline: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    
    <script type='text/javascript'>
      var Module = {
        canvas: (function() {
          return document.getElementById('canvas');
        })()
      };

      // --- MOBILE TOUCH-TO-KEYBOARD BRIDGE ---
      let touchStartX = 0;
      let touchStartY = 0;
      let lastTouchX = 0;
      let lastTouchY = 0;
      let touchStartTime = 0;
      
      const DRAG_THRESHOLD = 30; // Pixels required to trigger a move step

      function sendKey(key, type) {
        let code = key;
        let keyCode = 0;
        if (key === 'ArrowLeft') keyCode = 37;
        else if (key === 'ArrowRight') keyCode = 39;
        else if (key === 'ArrowUp') keyCode = 38;
        else if (key === 'ArrowDown') keyCode = 40;
        else if (key === ' ') keyCode = 32;

        window.dispatchEvent(new KeyboardEvent(type, {
          key: key,
          code: code,
          keyCode: keyCode,
          which: keyCode,
          bubbles: true
        }));
      }

      window.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          lastTouchX = touchStartX;
          lastTouchY = touchStartY;
          touchStartTime = new Date().getTime();
        }
      }, { passive: false });

      window.addEventListener('touchmove', function(e) {
        if (e.touches.length === 1) {
          let currentX = e.touches[0].clientX;
          let currentY = e.touches[0].clientY;
          let diffX = currentX - lastTouchX;
          let diffY = currentY - lastTouchY;

          // Horizontal Drag (Left / Right)
          if (diffX <= -DRAG_THRESHOLD) {
            sendKey('ArrowLeft', 'keydown');
            setTimeout(() => sendKey('ArrowLeft', 'keyup'), 50);
            lastTouchX = currentX;
          } else if (diffX >= DRAG_THRESHOLD) {
            sendKey('ArrowRight', 'keydown');
            setTimeout(() => sendKey('ArrowRight', 'keyup'), 50);
            lastTouchX = currentX;
          }

          // Vertical Drag (Soft Drop)
          if (diffY >= DRAG_THRESHOLD) {
            sendKey('ArrowDown', 'keydown');
            setTimeout(() => sendKey('ArrowDown', 'keyup'), 50);
            lastTouchY = currentY;
          }
        }
        e.preventDefault();
      }, { passive: false });

      window.addEventListener('touchend', function(e) {
        let touchDuration = new Date().getTime() - touchStartTime;
        let totalDistX = Math.abs(lastTouchX - touchStartX);
        let totalDistY = lastTouchY - touchStartY;

        // Quick Tap -> Rotate (Arrow Up)
        if (touchDuration < 250 && totalDistX < 15 && Math.abs(totalDistY) < 15) {
          sendKey('ArrowUp', 'keydown');
          setTimeout(() => sendKey('ArrowUp', 'keyup'), 50);
        }
        // Fast Swipe Down -> Hard Drop (Space)
        else if (touchDuration < 300 && totalDistY > 100) {
          sendKey(' ', 'keydown');
          setTimeout(() => sendKey(' ', 'keyup'), 50);
        }
      }, { passive: false });
    </script>
    
    {{{ SCRIPT }}}
  </body>
</html>
