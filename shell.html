<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch Tetris</title>
    <style>
      body {
        margin: 0;
        background-color: #0b0b0b;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }
      canvas.emscripten {
        border: 0px none;
        background-color: #000;
        outline: none;
        width: 100%;
        height: 100%;
        object-fit: contain; /* Keeps your game's aspect ratio crisp without stretching */
      }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    
    <script type='text/javascript'>
      var Module = {
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          return canvas;
        })()
      };
    </script>
    
    {{{ SCRIPT }}}
  </body>
</html>
